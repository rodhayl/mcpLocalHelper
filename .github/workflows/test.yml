name: MCP Local LLM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build
        run: npm run build

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Setup Python (for test validation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure settings file exists
        run: |
          if [ ! -f env-automated-tests.settings ]; then
            cp env.settings.example env-automated-tests.settings
          fi

      - name: Run unit tests (non-LLM)
        run: |
          # Run tests that don't require actual LLM backend
          npx vitest run tests/blackbox-improvements.test.ts tests/improvement-plans-*.test.ts tests/e2e.tool-discovery.matrix.test.ts tests/config.*.test.ts --reporter=verbose
        env:
          CI: true
          NODE_ENV: test
          MCP_LOCAL_LLM_SETTINGS_PATH: env-automated-tests.settings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/
          retention-days: 7

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint
